services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campuslink
      POSTGRES_USER: campuslink
      POSTGRES_PASSWORD: campuslink
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuslink -d campuslink"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    volumes:
      - upload_data:/app/data/uploads
    ports:
      - "8000:8000"
    environment:
      CAMPUSLINK_DATABASE_URL: postgresql+psycopg://campuslink:campuslink@db:5432/campuslink
      CAMPUSLINK_JWT_SECRET_KEY: change-this-before-production
      CAMPUSLINK_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CAMPUSLINK_AUTO_CREATE_TABLES: "true"
      CAMPUSLINK_SEED_DEMO_DATA: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  upload_data:

